name: Deploy Plugins to Staging (matrix)

on:
  push:
    branches: [staging]
  workflow_dispatch:

# A second push waits for this run instead of opening another set of SSH sessions.
concurrency:
  group: deploy-plugins-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-plugins:
    runs-on: ubuntu-latest
    strategy:
      # One dropped connection must not cancel the other domains.
      fail-fast: false
      # The host resets SSH when every domain connects at once.
      max-parallel: 1
      matrix:
        include:
          - domain: staging.norhage.lt
            user: norhage-staging-lt
          - domain: staging.norhage.de
            user: norhage-staging-de
          - domain: staging.norhage.no
            user: norhage-staging-no
          - domain: staging.norhage.se
            user: norhage-staging-se
          - domain: staging.norhage.fi
            user: norhage-staging
          - domain: staging.norhage.eu
            user: norhage-staging-eu
          - domain: staging.norhage.dk
            user: norhage-staging-dk

    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST_STAGING }}
      SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY_STAGING }}
      PLUGIN_DIR: "public/wp-content/plugins"
      RSYNC_DELETE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write private key to file
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ env.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ls -la ~/.ssh/deploy_key

      - name: Show config
        run: |
          echo "Plugin path in repo: ${PLUGIN_DIR}"
          echo "Target host: ${SFTP_HOST}"
          echo "Matrix domain: ${{ matrix.domain }}, user: ${{ matrix.user }}"
          echo "RSYNC_DELETE=${RSYNC_DELETE}"

      - name: Resolve remote directory
        env:
          matrix_user: ${{ matrix.user }}
          matrix_domain: ${{ matrix.domain }}
        run: |
          REMOTE_SUBPATH="${PLUGIN_DIR#public/}"
          echo "REMOTE_DIR=/home/${matrix_user}/htdocs/${matrix_domain}/${REMOTE_SUBPATH%/}" >> "$GITHUB_ENV"

      - name: Deploy plugins
        uses: ./.github/actions/sftp-deploy
        with:
          ssh_user: ${{ matrix.user }}
          ssh_host: ${{ env.SFTP_HOST }}
          domain: ${{ matrix.domain }}
          local_dir: ${{ env.PLUGIN_DIR }}
          remote_dir: ${{ env.REMOTE_DIR }}
          ssh_options: "-o StrictHostKeyChecking=no"
          # Theme deploys pause 10s. Plugins pause longer so the two workflows,
          # which start on the same push, do not open SSH in the same second.
          pause_seconds: "25"
          rsync_delete: ${{ env.RSYNC_DELETE }}
          verify_lines: "60"
