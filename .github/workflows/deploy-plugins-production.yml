name: Deploy Plugins to Production (matrix)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push waits for this run instead of opening another set of SSH sessions.
concurrency:
  group: deploy-plugins-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-plugins:
    runs-on: ubuntu-latest
    strategy:
      # One dropped connection must not cancel the other domains.
      fail-fast: false
      # The host resets SSH when every domain connects at once.
      max-parallel: 1
      matrix:
        include:
          - domain: norhage.de
            user: norhage-de
          - domain: norhage.fi
            user: norhage-fi
          - domain: norhage.lt
            user: norhage-lt
          - domain: norhage.no
            user: norhage-no
          - domain: norhage.se
            user: norhage-se
          - domain: norhage.eu
            user: norhage-eu
          - domain: norhage.dk
            user: norhage-dk

    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST_PROD }}
      SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY_PROD }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS_PROD }}
      PLUGIN_DIR: "public/wp-content/plugins"
      RSYNC_DELETE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write private key to file
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ env.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ls -la ~/.ssh/deploy_key

      - name: Setup known_hosts and SSH options
        run: |
          if [ -n "${SFTP_KNOWN_HOSTS}" ]; then
            mkdir -p ~/.ssh
            printf "%s\n" "${SFTP_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "SSH_CMD_OPTS=-o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
            echo "Known hosts written"
          else
            echo "SSH_CMD_OPTS=-o StrictHostKeyChecking=no" >> "$GITHUB_ENV"
            echo "SFTP_KNOWN_HOSTS not set; using StrictHostKeyChecking=no"
          fi

      - name: Show config
        run: |
          echo "Plugin path in repo: ${PLUGIN_DIR}"
          echo "Target host: ${SFTP_HOST}"
          echo "Matrix domain: ${{ matrix.domain }}, user: ${{ matrix.user }}"
          echo "RSYNC_DELETE=${RSYNC_DELETE}"
          echo "SSH options: $SSH_CMD_OPTS"

      - name: Resolve remote directory
        env:
          matrix_user: ${{ matrix.user }}
          matrix_domain: ${{ matrix.domain }}
        run: |
          REMOTE_SUBPATH="${PLUGIN_DIR#public/}"
          echo "REMOTE_DIR=/home/${matrix_user}/htdocs/${matrix_domain}/${REMOTE_SUBPATH%/}" >> "$GITHUB_ENV"

      - name: Deploy plugins
        uses: ./.github/actions/sftp-deploy
        with:
          ssh_user: ${{ matrix.user }}
          ssh_host: ${{ env.SFTP_HOST }}
          domain: ${{ matrix.domain }}
          local_dir: ${{ env.PLUGIN_DIR }}
          remote_dir: ${{ env.REMOTE_DIR }}
          ssh_options: ${{ env.SSH_CMD_OPTS }}
          # Theme deploys pause 10s. Plugins pause longer so the two workflows,
          # which start on the same push, do not open SSH in the same second.
          pause_seconds: "25"
          rsync_delete: ${{ env.RSYNC_DELETE }}
          verify_lines: "60"
